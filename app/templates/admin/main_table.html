<div class="col-12 border-end overflow-auto h-100 p-0">
    
    <table class="table table-sm table-striped table-bordered table-hover mb-0">
        <thead class="table-light sticky-top shadow-sm">
                {% for col in columns %}
                <th class="py-2 px-3">{{ col }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
        {% if data %}
        
            {% for row in data %}
            <tr>
                {% for col in columns %}
                <td class="p-0">
                    <a href="" 
                    class="text-decoration-none text-reset d-block py-2 px-3">
                        {{ row[col] if row[col] is not none else "" }}
                    </a>
                </td>
                {% endfor %}
            </tr>
            {% endfor %}
            {% endif %}
        </tbody>
    </table>
</div>
