<div class="col-6 border-end overflow-auto h-100 p-0">
    {% if data %}
    <table class="table table-sm table-striped table-bordered table-hover mb-0">
        <thead class="table-light sticky-top shadow-sm">
            <tr>
                {% for col in columns %}
                <th class="py-2 px-3">{{ col }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
            <tr>
                {% for col in columns %}
                <td class="py-2 px-3">
                    {{ row[col] if row[col] is not none else "" }}
                </td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="p-4 text-muted text-center">Выберите таблицу для просмотра данных</div>
    {% endif %}
</div>
