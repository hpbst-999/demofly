

<form action="{{ request.full_path }}" method="POST">
    
   
    <input type="hidden" name="page" value="{{ request.args.get('page', '1') }}">
    <input type="hidden" name="q" value="{{ request.args.get('q', '') }}">
    <input type="hidden" name="selected_id" value="{{ request.args.get('q', '') }}">


    <div class="mb-3">
        <label class="form-label fw-bold">Код аэропорта (3 буквы)</label>
        <input type="text" name="airport_code" class="form-control" 
               value="{{ item.airport_code if item else '' }}" 
               {% if item %}readonly{% endif %} required maxlength="3">
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Название аэропорта</label>
        <input type="text" name="airport_name" class="form-control" 
               value="{{ item.airport_name if item else '' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Город</label>
        <input type="text" name="city" class="form-control" 
               value="{{ item.city if item else '' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Страна</label>
        <input type="text" name="country" class="form-control" 
               value="{{ item.country if item else '' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Координаты</label>
        <input type="text" name="coordinates" class="form-control" 
               value="{{ item.coordinates if item else '' }}">
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Часовой пояс</label>
        <input type="text" name="timezone" class="form-control" 
               value="{{ item.timezone if item else '' }}" required>
    </div>
    
    <div class="mt-4 pt-2 text-center">
        <button type="submit" class="btn btn-dark btn-lg px-5 rounded-3">Сохранить</button>
    </div>
</form>
